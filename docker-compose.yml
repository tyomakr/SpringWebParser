services:
  backend:
    build: ./backend
    image: swp-backend:latest
    container_name: swp-backend
    ports:
      - "8111:8111"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8111/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - ml-service
    environment:
      ML_PUBLISH_API_KEY: example-token
      SPRING_APPLICATION_JSON: '{"ml":{"publish":{"base-url":"http://ml-service:8000","recommendation-path":"/recommend","timeout-seconds":6}}}'
    networks: [app-net]

  frontend:
    build: ./ui
    image: swp-frontend:latest
    container_name: swp-frontend
    ports:
      - "3333:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks: [app-net]

  ml-service:
    build: ./ml-service
    image: swp-ml-service:latest
    container_name: swp-ml-service
    ports:
      - "38000:8000"
    environment:
      - ML_PUBLISH_API_KEY=example-token
    networks: [app-net]

networks:
  app-net:
    driver: bridge

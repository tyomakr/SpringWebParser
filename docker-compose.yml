services:
  backend:
    build: ./backend
    image: swp-backend:latest
    container_name: swp-backend
    expose: ["8111"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8111/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks: [app-net]

  frontend:
    build: ./ui                 # <-- контекст = ui/
    image: swp-frontend:latest
    container_name: swp-frontend
    ports:
      - "3333:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks: [app-net]

networks:
  app-net:
    driver: bridge
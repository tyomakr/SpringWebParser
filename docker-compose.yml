services:
  postgres:
    image: postgres:16-alpine
    container_name: swp-postgres
    environment:
      POSTGRES_USER: swp
      POSTGRES_PASSWORD: swp_pass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [app-net]

  postgres-init:
    image: postgres:16-alpine
    container_name: swp-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: swp_pass
    command:
      - sh
      - -c
      - |
        psql -h postgres -U swp -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='swp_backend'" | grep -q 1 \
          || psql -h postgres -U swp -d postgres -c "CREATE DATABASE swp_backend";
        psql -h postgres -U swp -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='swp_ml'" | grep -q 1 \
          || psql -h postgres -U swp -d postgres -c "CREATE DATABASE swp_ml";
    networks: [app-net]

  backend:
    build: ./backend
    image: swp-backend:latest
    container_name: swp-backend
    ports:
      - "8111:8111"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8111/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_started
    environment:
      ML_PUBLISH_API_KEY: example-token
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swp_backend
      SPRING_DATASOURCE_USERNAME: swp
      SPRING_DATASOURCE_PASSWORD: swp_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_APPLICATION_JSON: '{"ml":{"publish":{"base-url":"http://ml-service:8000","recommendation-path":"/recommend","timeout-seconds":6}}}'
    networks: [app-net]

  frontend:
    build: ./ui
    image: swp-frontend:latest
    container_name: swp-frontend
    ports:
      - "3333:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks: [app-net]

  ml-service:
    build:
      context: ./ml-service
      args:
        OCR_ENABLED: "true"
        CLIP_ENABLED: "true"
    image: swp-ml-service:latest
    container_name: swp-ml-service
    ports:
      - "38000:8000"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./ml-service/data:/app/data
    environment:
      - ML_PUBLISH_API_KEY=example-token
      - TRAINING_EXPORT_URL=http://backend:8111/api/vk-history/training/export
      - TRAINING_EXPORT_API_KEY=example-token
      - DB_URL=postgresql://swp:swp_pass@postgres:5432/swp_ml
      - SYNC_INTERVAL_SEC=60
      - SYNC_DEBUG=true
      - OCR_ENABLED=true
      - SIMILARITY_MODE=hybrid
      - SEMANTIC_BACKEND=clip
      - CLIP_MODEL_NAME=ViT-B-32
      - CLIP_PRETRAINED=openai
      - CLIP_DEVICE=cpu
      - SEMANTIC_MIN_SIMILARITY_PUBLISH=0.35
      - SEMANTIC_MIN_SIMILARITY_GRAY=0.30
    networks: [app-net]

networks:
  app-net:
    driver: bridge

server:
  port: 8111

spring:
  profiles:
    include: secret

  data:
    mongodb:
      uri: <your uri>

sites:
  fishki-url: "http://fishki.net/mix/"
  fishki-div-container-with-image: "div.embed-image-single"

env:
  parser:
    user-agents-file: "classpath:user-agents.txt"

    download-folder-name: "downloaded"

    proxy:
      proxy-url: "83.168.74.163"
      proxy-port: 8080

  vk-publisher:
    chunk-size: 10
    time-post-pub-delay: 1500